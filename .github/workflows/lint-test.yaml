name: Linting and Testing Pull Requests

on:
  pull_request:
    branches: [ "dev" ]
  # Run any pushed branch by hand: gh workflow run lint-test.yaml --ref <branch>
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

# No secrets: the tests run against a throwaway Postgres container, and
# conftest.py swaps in local file storage and fake integration keys, so
# nothing here is a real credential.
env:
  SECRET_KEY: ci-only-not-a-secret
  DEBUG: "True"
  ENV: dev
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  DB_NAME: kosmos
  DB_USER: kosmos
  DB_PASSWORD: kosmos
  DB_HOST: localhost
  EMAIL_BACKEND: locmem
  STORAGE_BACKEND: local

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync

      - name: Install ruff on PATH for pre-commit system hooks
        run: uv tool install ruff

      - name: Lint code
        run: uv run pre-commit run --all-files

  test:
    name: Test (Group ${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        group: [1, 2, 3, 4]
      fail-fast: false

    services:
      database:
        # pgvector ships the vector extension that migration case.0087 needs;
        # plain postgres images do not include it. pg16 matches dev and prod.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kosmos
          POSTGRES_PASSWORD: kosmos
          POSTGRES_DB: kosmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --splits 4 --group ${{ matrix.group }} -n auto --dist=loadscope --tb=short -q
