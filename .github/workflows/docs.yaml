name: Documentation

# Checks the documentation site (docs/, zensical.toml). A pull request into
# dev that touches the docs gets a strict build, which fails on a broken
# internal link.
#
# This workflow does not publish anything. The site is served from the
# project's own server at https://kosmos.law/docs/, which builds it from a
# checkout of this repository (see docs/dev/writing-docs.md).

on:
  pull_request:
    branches: [ "dev" ]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/build-docs.sh"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build the site
        run: scripts/build-docs.sh --strict
