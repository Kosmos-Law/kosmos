name: Documentation

# Builds the documentation site (docs/, zensical.toml) with Zensical.
# Pull requests into dev get a strict build, which fails on a broken
# internal link.
#
# The site's home is https://kosmos.law/docs/, served from the project's own
# server (see docs/dev/writing-docs.md). A push to dev also publishes a copy
# to GitHub Pages; that copy is a mirror and can be dropped by deleting the
# deploy job below.

on:
  pull_request:
    branches: [ "dev" ]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/build-docs.sh"
      - ".github/workflows/docs.yaml"
  push:
    branches: [ "dev" ]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/build-docs.sh"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build the site
        run: scripts/build-docs.sh --strict

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
