[project]
name = "kosmos"
version = "0.1.0"
description = "Kosmos - Django law practice management application"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Django core
    "Django==4.2.30",
    "psycopg2-binary==2.9.10",
    "django-environ==0.11.2",
    # Django extensions
    "django-mathfilters==1.0.0",
    "django-cleanup==8.1.0",
    "django-filter==24.3",
    "django-storages[s3]==1.14.6",
    "django-q2==1.7.2",
    "django-watson==1.6.3",
    "django-simple-history==3.7.0",
    # Date/time utilities
    "python-dateutil==2.9.0",
    "pytz==2024.1",
    "croniter==6.0.0",
    # Google APIs
    "google-api-python-client==2.136.0",
    "google-auth-oauthlib==0.4.6",
    "google-genai==1.54.0",
    # Markdown processing
    "Markdown==3.8.1",
    "pymdown-extensions==10.21.3",
    # Spreadsheet parsing (Drive notes -> Markdown tables)
    "openpyxl==3.1.5",
    "odfpy==1.4.1",
    # PDF generation and processing
    "weasyprint==69.0",
    "pytesseract==0.3.13",
    "pdf2image==1.17.0",
    "pypdf>=6.9.1",
    "ocrmypdf==16.12.0",
    # AI clients
    "anthropic==1.0.0",
    "cryptography==49.0.0",
    # Legal citation parsing
    "eyecite==2.7.6",
    # Build tools (needed by some packages)
    "setuptools==78.1.1",
    "gunicorn>=25.1.0",
    "requests>=2.33.0",
    "stripe>=15.3.0",
    "premailer>=3.10.0",
    "pgvector>=0.5.0",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "holidays>=0.86",
    "icalendar==7.3.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest==8.4.1",
    "pytest-django==4.8.0",
    "pytest-xdist==3.8.0",
    "pytest-split==0.10.0",
    # Code formatting and linting
    "pre-commit==3.7.1",
    # Dev-server gunicorn reload watcher
    "inotify>=0.2.12",
    "import-linter>=2.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# Keep the test database between runs: building it from every migration
# takes minutes on dev, longer than most targeted runs. New migrations still
# apply; pass --create-db after editing one that was already applied.
addopts = "--reuse-db"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
# Generated code; pre-commit skips it too, so `ruff format apps/` must not
# rewrite every migration.
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
fixable = ["ALL"]
extend-unsafe-fixes = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
omit = ["*migration*", "*__init__.py*"]

[tool.coverage.report]
show_missing = true

# ---------------------------------------------------------------------------
# Module boundaries, checked by `uv run lint-imports` (CI runs it).
#
# The case builder (apps.case, apps.drive, apps.notes) is a module with a
# known surface, so it could one day be extracted: it depends only on the
# core (accounts, settings, management, matters, contacts, folders) and
# the model-provider layer (apps.llm); the core never imports it; and the
# apps that sit on top of it (apps.ai, apps.mail, apps.drafts) reach it
# only through apps.case.models, apps.case.services, apps.case.courtlistener
# and apps.case.jurisdictions. Direct imports are what is checked; tests and
# migrations are exempt.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["apps"]

[[tool.importlinter.contracts]]
name = "The case builder depends only on the core"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["apps.case", "apps.drive", "apps.notes"]
forbidden_modules = [
    "apps.ai", "apps.drafts", "apps.mail",
    "apps.intakes", "apps.invoicing", "apps.trust", "apps.activity",
    "apps.tasks", "apps.calendar", "apps.dash", "apps.reports",
    "apps.checklists",
]
ignore_imports = [
    "apps.*.tests.** -> apps.**",
    "apps.*.migrations.** -> apps.**",
]

[[tool.importlinter.contracts]]
name = "The core does not know the case builder"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "apps.accounts", "apps.settings", "apps.management", "apps.matters",
    "apps.contacts", "apps.folders", "apps.calendar", "apps.tasks",
    "apps.activity", "apps.invoicing", "apps.trust", "apps.checklists",
    "apps.dash", "apps.reports", "apps.intakes", "apps.search",
]
forbidden_modules = ["apps.case", "apps.drive", "apps.notes"]
ignore_imports = [
    "apps.*.tests.** -> apps.**",
    "apps.*.migrations.** -> apps.**",
    # The one sanctioned seam: Settings > Integrations is where Google is
    # connected, for the Drive mirror as for Gmail.
    "apps.settings.integrations.** -> apps.drive.google",
]

[[tool.importlinter.contracts]]
name = "The case app's internals are private"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "apps.ai", "apps.llm", "apps.drafts", "apps.mail",
    "apps.accounts", "apps.settings", "apps.management", "apps.matters",
    "apps.contacts", "apps.folders", "apps.calendar", "apps.tasks",
    "apps.activity", "apps.invoicing", "apps.trust", "apps.checklists",
    "apps.dash", "apps.reports", "apps.intakes", "apps.search",
]
forbidden_modules = [
    "apps.case.documents", "apps.case.facts", "apps.case.highlights",
    "apps.case.labels", "apps.case.witnesses", "apps.case.caselaws",
    "apps.case.search", "apps.case.notes", "apps.case.views",
    "apps.case.semantic", "apps.case.search_config", "apps.case.tabs",
    "apps.case.registrations", "apps.case.abbreviate",
    "apps.case.courtlistener_throttle",
    "apps.case.management", "apps.case.templatetags", "apps.case.urls",
    "apps.case.apps",
]
ignore_imports = [
    "apps.*.tests.** -> apps.**",
    "apps.*.migrations.** -> apps.**",
]

[[tool.importlinter.contracts]]
name = "The model-provider layer stands alone"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["apps.llm"]
forbidden_modules = [
    "apps.ai", "apps.case", "apps.drive", "apps.notes", "apps.mail",
    "apps.drafts", "apps.accounts", "apps.management", "apps.matters",
    "apps.contacts", "apps.folders", "apps.calendar", "apps.tasks",
    "apps.activity", "apps.invoicing", "apps.trust", "apps.checklists",
    "apps.dash", "apps.reports", "apps.intakes", "apps.search",
]
ignore_imports = ["apps.*.tests.** -> apps.**"]
