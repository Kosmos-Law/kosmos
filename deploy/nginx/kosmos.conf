# Kosmos nginx site. Rendered by scripts/install.sh --prod into
# /etc/nginx/sites-available/kosmos. HTTP only: run
#   sudo certbot --nginx -d @DOMAIN@
# afterwards and certbot rewrites this file with the TLS listeners and the
# port-80 redirect. install.sh never overwrites a certbot-managed file unless
# told to with --force.

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    include snippets/kosmos-security.conf;

    client_max_body_size 100M;

    location = /favicon.ico { access_log off; log_not_found off; }

    # JS is served as native ES modules: static_v cache-busts only the entry
    # <script> URLs, while nested imports are bare paths the browser resolves
    # from cache. no-cache = store but revalidate every time (ETag 304s, still
    # cheap), so a deploy that changes any module reaches every browser
    # immediately. Must sort before the general /static/ block.
    location ^~ /static/js/ {
        root @APP_DIR@;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        root @APP_DIR@;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(accounts/login|admin/login) {
        include snippets/limit-login.conf;
        include proxy_params;
        proxy_pass http://unix:/run/law.sock;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/law.sock;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
