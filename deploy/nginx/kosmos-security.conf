# Security headers and hygiene shared by the Kosmos site.
# Installed to /etc/nginx/snippets/kosmos-security.conf by scripts/install.sh.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Never serve dotfiles (.env, .git, ...) even if a root points at the checkout.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
