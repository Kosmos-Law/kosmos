# Security headers and hygiene shared by the Kosmos site.
# Installed to /etc/nginx/snippets/kosmos-security.conf by scripts/install.sh.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The OAuth discovery documents behind the Claude connector (RFC 9728 and
# RFC 8414) live under /.well-known/ and are served by Kosmos. A prefix
# location sorts before the hidden-files rule below, which would
# otherwise answer 403 and leave Claude guessing at the endpoints.
location ^~ /.well-known/oauth- {
    include proxy_params;
    proxy_pass http://unix:/run/law.sock;
}

# Never serve dotfiles (.env, .git, ...) even if a root points at the checkout.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
