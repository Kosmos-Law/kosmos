# Rate-limit zones used by the Kosmos site. Lives in the http block via
# conf.d/. scripts/install.sh only installs this file when no other config
# already defines a "login" zone (duplicate zone names are a fatal error).
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
