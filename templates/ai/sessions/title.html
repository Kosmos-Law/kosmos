{% comment %}
The session's title in the page header. Click the title to rename it in
place; the form posts and this fragment comes back. Also sent out of band
after the first prompt names the session.
{% endcomment %}
<span id="sessionTitle"
      x-data="{ editing: false }"
      {% if oob %}hx-swap-oob="true"{% endif %}>
  <h1 class="session-title"
      x-show="!editing"
      @click="editing = true; $nextTick(() => $refs.input.select())"
      title="Click to rename">{{ session.display_title }}</h1>
  <form x-show="editing"
        x-cloak
        class="session-rename"
        hx-post="{% url 'ai:session-rename' session.id %}"
        hx-target="#sessionTitle"
        hx-swap="outerHTML"
        @keydown.escape="editing = false">
    <input type="text"
           name="title"
           x-ref="input"
           class="form-control"
           value="{{ session.title }}"
           maxlength="255"
           required>
  </form>
</span>
