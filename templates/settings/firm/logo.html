{% if slot.logo %}
  <div class="firm-logo-row">
    <div class="firm-logo-preview firm-logo-preview-{{ slot.name }}">
      {# djlint:off H006 #}
      <img src="{{ slot.logo.url }}" alt="{{ slot.label }}" />
      {# djlint:on #}
    </div>
    <button type="button"
            class="btn-icon"
            aria-label="Remove {{ slot.label|lower }}"
            hx-post="{% url 'settings:firm-remove-logo' slot.name %}"
            hx-target="#firm-logo-{{ slot.name }}"
            hx-confirm="Remove the {{ slot.label|lower }}?">
      <i class="icon-circle-x"></i>
    </button>
  </div>
{% else %}
  {{ slot.field }}
  {% if slot.field.help_text %}<div class="help-text">{{ slot.field.help_text }}</div>{% endif %}
  {{ slot.field.errors }}
{% endif %}
