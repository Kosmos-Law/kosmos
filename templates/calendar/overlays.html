<button type="button"
        class="{% if show_tasks %}toggle-active{% endif %}"
        hx-post="{% if show_tasks %}{% url 'calendar:show-tasks' 'off' %}{% else %}{% url 'calendar:show-tasks' 'on' %}{% endif %}"
        hx-swap="none"
        title="{% if show_tasks %}Hide my tasks{% else %}Show my tasks{% endif %}">
  <i class="icon-square-check"></i>
</button>
<button type="button"
        class="{% if show_holidays %}toggle-active{% endif %}"
        hx-post="{% if show_holidays %}{% url 'calendar:show-holidays' 'off' %}{% else %}{% url 'calendar:show-holidays' 'on' %}{% endif %}"
        hx-swap="none"
        title="{% if show_holidays %}Hide holidays{% else %}Show holidays{% endif %}">
  <i class="icon-party-popper"></i>
</button>
