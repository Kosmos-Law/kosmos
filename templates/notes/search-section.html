<div class="search-section">
  <div class="search-section-header">
    <span class="search-section-title">Notes</span>
    <span class="app-badge badge-gray">{{ rows|length }}</span>
  </div>
  <div class="search-cards">
    {% for note in rows %}
      <a href="{% url 'notes:note-view' note.id %}"
         class="search-card"
         target="_blank">
        <span class="app-badge app-badge-lg badge-gray"><i class="icon-sticky-note"></i></span>
        <div class="search-card-content">
          <div class="search-card-title">{{ note.title }}</div>
          <div class="search-card-meta">
            {% if note.matter %}{{ note.matter.name }} &bull;{% endif %}
            {% if note.topic %}{{ note.topic }} &bull;{% endif %}
            {{ note.get_category_display }}
          </div>
        </div>
      </a>
    {% endfor %}
  </div>
</div>
