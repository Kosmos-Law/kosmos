{% extends "base.html" %}
{% block content %}
  <div id="content" class="container content">
    <div>
      <table>
        {% for contact in contacts %}
          <tr>
            <td>{{ contact.name }}</td>
            <td>
              <button type="button"
                      class="btn-icon"
                      hx-post="{% url 'contacts:toggle-google-sync' id=contact.id %}"
                      hx-swap="none">
                <span class="material-icons">sync</span>
              </button>
            </td>
          </tr>
        {% endfor %}
      </table>
    </div>
  </div>
{% endblock content %}
