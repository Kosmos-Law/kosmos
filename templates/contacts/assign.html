<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">Assign Contact to Matter</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      {% if not matters %}<p class="modal-note">There are no open matters to assign this contact to.</p>{% endif %}
      {% comment %}
        Sent with htmx so a refusal (nothing chosen, already on the matter)
        can be said in a toast with the dialog still open.
      {% endcomment %}
      <form id="contact-assign-form"
            hx-post="{{ action }}"
            hx-swap="none"
            class="form-responsive form-spacious"
            role="form">
        {% csrf_token %}
        <label class="control-label">Matter:</label>
        <label>
          <select class="contacts-assignment-select" name="matter_id">
            {% for matter in matters %}<option value="{{ matter.id }}">{{ matter.name }}</option>{% endfor %}
          </select>
        </label>
        <label class="control-label">Group:</label>
        <label>
          <select class="contacts-assignment-select" name="group_id">
            {% for group in groups %}<option value="{{ group.id }}">{{ group.name }}</option>{% endfor %}
          </select>
        </label>
        <label class="control-label">Role:</label>
        <label>
          <select class="contacts-assignment-select" name="role_id">
            {% for role in roles %}<option value="{{ role.id }}">{{ role.name }}</option>{% endfor %}
          </select>
        </label>
      </form>
    </div>
    <div class="modal-footer">
      <button type="submit"
              form="contact-assign-form"
              class="btn btn-success"
              {% if not matters or not groups or not roles %}disabled{% endif %}>Submit</button>
    </div>
  </div>
</div>
