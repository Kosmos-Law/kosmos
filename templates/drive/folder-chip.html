{% comment %}
The AI tab's toolbar: the matter's folder in the firm's files, which the
agent works from. Unlinked is the state to notice, so it is spelled out.
{% endcomment %}
{% if configured %}
  <div class="folder-chip" id="ai-folder">
    {% if folder %}
      <button type="button"
              class="btn-icon folder-chip-btn{% if folder.missing_since %} folder-chip-missing{% endif %}"
              hx-get="{% url 'drive:folder-link-modal' matter.id %}"
              hx-target="#htmx-modal-container"
              hx-trigger="click"
              title="{% if folder.missing_since %}The folder is no longer at {{ folder.path }}. Link the matter to its new folder.{% else %}{{ folder.path }}. Click to change the linked folder.{% endif %}">
        {% if folder.missing_since %}
          <i class="icon-alert-triangle with-text"></i>Folder not found
        {% else %}
          <i class="icon-folder with-text"></i>{{ folder.name }}
        {% endif %}
      </button>
    {% else %}
      <button type="button"
              class="btn-icon folder-chip-btn folder-chip-unlinked"
              hx-get="{% url 'drive:folder-link-modal' matter.id %}"
              hx-target="#htmx-modal-container"
              hx-trigger="click"
              title="The AI cannot read this matter's files until the matter is linked to its folder in the firm's files.">
        <i class="icon-folder-x with-text"></i>No folder linked
      </button>
    {% endif %}
  </div>
{% endif %}
