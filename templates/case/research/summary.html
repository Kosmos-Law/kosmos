{% load markdown_extras %}
{% if query.status == "complete" and query.final_summary %}
  <div class="research-final-summary">
    <h4>Answer</h4>
    <div>{{ query.final_summary|render_markdown }}</div>
  </div>
{% elif query.status == "complete" and query.error_message %}
  <div class="research-error">
    <i class="icon-alert-triangle"></i>
    {{ query.error_message }}
  </div>
{% endif %}
