<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">Filter Documents</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="documents-filter-form"
            class="form-responsive form-spacious filter"
            hx-target="#htmx-modal-container"
            hx-post="{% url 'case:documents-filter' matter.id %}">
        {% csrf_token %}
        {{ filter.form }}
      </form>
    </div>
    <div class="modal-footer">
      {% comment %}
        The filter is stored per matter (documents_filter_<matter id>), so that
        is the key to clear.
      {% endcomment %}
      {% with matter_key=matter.id|stringformat:"s" %}
        <button type="button"
                class="btn btn-secondary"
                hx-post="{% url 'management:clear-filters' session_key='documents_filter_'|add:matter_key trigger='documentsChanged' %}">
          Restore Defaults
        </button>
      {% endwith %}
      <button type="submit" form="documents-filter-form" class="btn btn-success">Apply</button>
    </div>
  </div>
</div>
