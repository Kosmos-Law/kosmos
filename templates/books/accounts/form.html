<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">
        {% if account %}
          Edit Account
        {% else %}
          Add Account
        {% endif %}
      </h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="account-form"
            hx-post="{% if account %}{% url 'books:account-edit' account.id %}{% else %}{% url 'books:account-add' %}{% endif %}"
            hx-target="#htmx-modal-container"
            role="form"
            class="form-compact col2">
        {% csrf_token %} {{ form }}
      </form>
      <p class="detail-text">
        The tax lines are where the account's total lands on the return;
        balance-sheet accounts have none. A role names the account the
        posting rules use, one account per role.
      </p>
    </div>
    <div class="modal-footer">
      <button type="submit" form="account-form" class="btn btn-success">Save</button>
    </div>
  </div>
</div>
