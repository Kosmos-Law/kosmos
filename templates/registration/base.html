{% load static %}
{% load cache_buster %}
<!DOCTYPE html>
<meta charset="UTF-8" content="" />
<title>Kosmos</title>
{% if env == 'dev' %}
  <link rel="icon"
        type="image/svg+xml"
        data-favicon="brand-dev"
        href="{% static_v 'images/kosmos-mark-dev.svg' %}" />
{% else %}
  <link rel="icon"
        type="image/svg+xml"
        data-favicon="brand"
        href="{% static_v 'images/kosmos-mark.svg' %}" />
{% endif %}
<!-- set viewport for mobile devices -->
<meta name="viewport" content="width = device-width, initial-scale = 1" />
<!-- Bootstrap Reboot (CSS reset) -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css">
<!-- Lucide icons (the password field's eye) -->
<link rel="stylesheet"
      href="https://unpkg.com/lucide-static@1.28.0/font/lucide.css" />
<!-- app stylesheets -->
<link rel="stylesheet" href="{% static_v 'css/palette.css' %}" />
<link rel="stylesheet" href="{% static_v 'css/icons.css' %}" />
<link rel="stylesheet" href="{% static_v 'css/colors.css' %}" />
<link rel="stylesheet" href="{% static_v 'css/typeography.css' %}" />
<link rel="stylesheet" href="{% static_v 'css/layout.css' %}" />
<link rel="stylesheet" href="{% static_v 'css/buttons.css' %}" />
<link rel="stylesheet" href="{% static_v 'css/apps/accounts.css' %}" />
<script>
  /* Apply the user's theme before paint (mirrors base.html). */
  (function () {
    var setting = localStorage.getItem('theme') || 'auto';
    var resolved = setting === 'auto'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : setting;
    document.documentElement.setAttribute('data-theme', resolved);
  })();
</script>
<div class="container vertical-center">
  {% block content %}
  {% endblock content %}
</div>
{# Paints the favicon from the theme's tokens, as on the signed-in pages. #}
<script src="{% static_v 'js/theme.js' %}"></script>
<script src="{% static_v 'js/password-toggle.js' %}"></script>
