# Documentation site. Pages live in docs/; see docs/dev/writing-docs.md.
#   scripts/build-docs.sh            build into site/
#   scripts/build-docs.sh --strict   and fail on a broken link
# The Zensical version is pinned in scripts/build-docs.sh.

[project]
site_name = "Kosmos Documentation"
site_description = "Documentation for Kosmos, practice management for small law firms."
site_url = "https://kosmos.law/docs/"
repo_url = "https://github.com/Kosmos-Law/kosmos"
repo_name = "GitHub"
edit_uri = "edit/dev/docs/"
copyright = '<a href="https://kosmos.law/">kosmos.law</a> · <a href="https://github.com/Kosmos-Law/kosmos/blob/dev/LICENSE">License</a> · <a href="mailto:info@kosmos.law">info@kosmos.law</a>'
# The look follows kosmos.law (the Kosmos-Law/web repository): its palette,
# typeface and mark. See docs/stylesheets/kosmos.css.
extra_css = ["stylesheets/kosmos.css"]

nav = [
  { "Home" = "index.md" },
  { "Install Kosmos" = [
    "admin/index.md",
    { "Install" = [
      { "Install with the script" = "admin/install.md" },
      { "Install by hand" = "admin/install-manual.md" },
      { "Configuration" = "admin/configuration.md" },
    ] },
    { "Integrations" = [
      { "Outgoing email" = "admin/integrations/email.md" },
      { "File storage" = "admin/integrations/storage.md" },
      { "AI providers and research" = "admin/integrations/ai.md" },
      { "Online payments" = "admin/integrations/payments.md" },
      { "Google Workspace" = "admin/integrations/google.md" },
      { "Gmail sync" = "admin/integrations/gmail.md" },
      { "Intakes from email" = "admin/integrations/inbound-email.md" },
      { "Drafting with LibreOffice" = "admin/integrations/libreoffice.md" },
      { "Claude Desktop" = "admin/integrations/claude-desktop.md" },
    ] },
    { "Operate" = [
      { "Background worker" = "admin/worker.md" },
      { "Monitoring" = "admin/monitoring.md" },
      { "Backup and restore" = "admin/backup.md" },
      { "Upgrading" = "admin/upgrading.md" },
      { "Troubleshooting" = "admin/troubleshooting.md" },
    ] },
    { "Access and security" = [
      { "Users and permissions" = "admin/users.md" },
      { "Security checklist" = "admin/security.md" },
    ] },
  ] },
  { "Use Kosmos" = [
    "guide/index.md",
  ] },
  { "Develop Kosmos" = [
    "dev/index.md",
    { "Conventions" = [
      { "CSS theming" = "dev/frontend/theming.md" },
      { "Writing documentation" = "dev/writing-docs.md" },
      { "Squashing migrations" = "dev/squashing-migrations.md" },
    ] },
    { "Subsystems" = [
      { "Agentic chat" = "dev/subsystems/ai/agent-chat.md" },
      { "Research tab" = "dev/subsystems/ai/research-tab.md" },
      { "MCP server and JSON APIs" = "dev/subsystems/mcp.md" },
    ] },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Environment variables" = "reference/environment.md" },
    { "Management commands" = "reference/commands.md" },
    { "Scheduled jobs" = "reference/schedules.md" },
    { "Permissions" = "reference/permissions.md" },
  ] },
  { "Decisions" = [
    "decisions/index.md",
    { "Research chat (retired)" = "decisions/research-chat-retired.md" },
    { "Claude Desktop roadmap" = "decisions/claude-desktop-roadmap.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/kosmos-mark-inline.svg"
favicon = "assets/favicon.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.font]
text = "Schibsted Grotesk"

# Night is kosmos.law's own palette; day borrows the application's
# nord-light theme. The reader's system setting picks the first one shown,
# and the header toggle switches. The colours are set in
# docs/stylesheets/kosmos.css on top of the theme's two schemes.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra]
# The mark in the header leads back to the main site.
homepage = "https://kosmos.law/"
generator = false

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
# Icon shortcodes such as :lucide-link:, drawn inline as SVG.
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
